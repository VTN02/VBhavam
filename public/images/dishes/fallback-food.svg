<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121622" />
      <stop offset="50%" stop-color="#181d2c" />
      <stop offset="100%" stop-color="#0e1118" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" />
  <rect width="800" height="600" fill="url(#glow)" />

  <!-- Subtle Pattern -->
  <circle cx="400" cy="270" r="140" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.3" />
  <circle cx="400" cy="270" r="180" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.15" />

  <!-- Cloche / Plate Icon -->
  <g transform="translate(400, 260) scale(1.6)">
    <!-- Food Cloche Cover -->
    <path d="M-40,10 C-40,-35 40,-35 40,10 Z" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" />
    <!-- Handle -->
    <circle cx="0" cy="-38" r="5" fill="url(#gold)" />
    <!-- Tray / Base plate -->
    <path d="M-55,14 L55,14" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" />
    <path d="M-45,20 L45,20" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <!-- Steam Lines -->
    <path d="M-15,-48 Q-10,-58 -15,-68" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M0,-52 Q5,-62 0,-72" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <path d="M15,-48 Q20,-58 15,-68" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Pure Veg Indicator Badge -->
  <g transform="translate(400, 420)">
    <!-- Outer green square with rounded corners -->
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
    <circle cx="-42" cy="0" r="4.5" fill="#34d399" />
    <text x="-25" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="1">100% PURE VEG</text>
  </g>

  <!-- Title Text -->
  <text x="400" y="480" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#fef3c7" letter-spacing="0.5">Vishnu Bhavan</text>
  <text x="400" y="510" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="1.5">AUTHENTIC JAFFNA SPECIALTY</text>
</svg>
